name: Sync Leetcode
on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC only, so these are pinned to Pacific Daylight Time
    # (UTC-7). During Standard Time they land an hour earlier in local terms:
    # 07:00 and 18:00 PST.
    - cron: "0 15 * * *"  # 08:00 PDT
    - cron: "0 2 * * *"   # 19:00 PDT (previous day in UTC)
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
